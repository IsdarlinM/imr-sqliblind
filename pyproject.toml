[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imr-sqliblind"
version = "0.3.0"
description = "Bounded blind SQL injection research helper for authorized labs and CTFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]
license = {text = "MIT"}
authors = [{name = "imr"}]

[project.scripts]
sqliblind = "blind_sqli.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-requests>=2.31",
  "bandit>=1.8,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["blind_sqli"]
