name: imr-sqliblind tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"
      - name: Compile
        run: python -m compileall -q src sqli_gallery.py sqliblind.py tests
      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Pytest
        run: pytest -q
      - name: Validate web JavaScript
        run: node --check src/blind_sqli/webui/app.js
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -q -r src

  installer-linux:
    name: Linux native installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with custom prefix
        run: |
          chmod +x install.sh uninstall.sh
          ./install.sh --prefix "$RUNNER_TEMP/imr-sqliblind" --no-path
          "$RUNNER_TEMP/imr-sqliblind/bin/sqliblind" --version
          "$RUNNER_TEMP/imr-sqliblind/bin/sqliblind" web --help
      - name: Uninstall
        run: |
          ./uninstall.sh --prefix "$RUNNER_TEMP/imr-sqliblind" --no-path
          test ! -e "$RUNNER_TEMP/imr-sqliblind"

  installer-windows:
    name: Windows native installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with custom prefix
        shell: cmd
        run: |
          call install.cmd --prefix "%RUNNER_TEMP%\imr-sqliblind" --no-path
          call "%RUNNER_TEMP%\imr-sqliblind\bin\sqliblind.cmd" --version
          call "%RUNNER_TEMP%\imr-sqliblind\bin\sqliblind.cmd" web --help
      - name: Uninstall
        shell: cmd
        run: |
          call uninstall.cmd --prefix "%RUNNER_TEMP%\imr-sqliblind" --no-path
          if exist "%RUNNER_TEMP%\imr-sqliblind" exit /b 1
