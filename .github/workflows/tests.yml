name: imr-sqliblind tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"
      - name: Compile
        run: python -m compileall -q src sqli_gallery.py sqliblind.py tests
      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Pytest
        run: pytest -q
      - name: Validate web JavaScript
        run: |
          for script in src/blind_sqli/webui/*.js; do
            node --check "$script"
          done
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -q -r src

  browser:
    name: Chromium browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,browser]"
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: pytest -m browser --browser chromium --tracing=retain-on-failure -q

  installer-linux:
    name: Linux native installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with custom prefix
        run: |
          chmod +x install.sh uninstall.sh
          ./install.sh --prefix "$RUNNER_TEMP/imr-sqliblind" --no-path
          "$RUNNER_TEMP/imr-sqliblind/bin/sqliblind" --version
          "$RUNNER_TEMP/imr-sqliblind/bin/sqliblind" web --help
      - name: Validate service lifecycle
        run: |
          set -eu
          command="$RUNNER_TEMP/imr-sqliblind/bin/sqliblind"
          trap '"$command" stop >/dev/null 2>&1 || true' EXIT
          "$command" start
          "$command" status
          "$command" stop
          trap - EXIT
      - name: Uninstall
        run: |
          ./uninstall.sh --prefix "$RUNNER_TEMP/imr-sqliblind" --no-path
          test ! -e "$RUNNER_TEMP/imr-sqliblind"

  installer-windows:
    name: Windows native installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with managed Python and persistent PATH
        shell: cmd
        run: |
          call install.cmd --prefix "%RUNNER_TEMP%\imr-sqliblind" --managed-python
          where sqliblind
          sqliblind --version
          sqliblind web --help
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$bin=(Join-Path $env:RUNNER_TEMP 'imr-sqliblind\bin').TrimEnd('\'); $current=[Environment]::GetEnvironmentVariable('Path','User'); $found=$false; if($current){ foreach($item in $current.Split(';')){ if($item -and $item.TrimEnd('\') -ieq $bin){ $found=$true; break } } }; if(-not $found){ exit 1 }"
      - name: Validate service lifecycle
        shell: cmd
        run: |
          sqliblind start
          if errorlevel 1 exit /b 1
          sqliblind status
          if errorlevel 1 (
            sqliblind stop
            exit /b 1
          )
          sqliblind stop
          if errorlevel 1 exit /b 1
      - name: Uninstall and clean persistent PATH
        shell: cmd
        run: |
          call uninstall.cmd --prefix "%RUNNER_TEMP%\imr-sqliblind"
          if exist "%RUNNER_TEMP%\imr-sqliblind" exit /b 1
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$bin=(Join-Path $env:RUNNER_TEMP 'imr-sqliblind\bin').TrimEnd('\'); $current=[Environment]::GetEnvironmentVariable('Path','User'); if($current){ foreach($item in $current.Split(';')){ if($item -and $item.TrimEnd('\') -ieq $bin){ exit 1 } } }; foreach($name in @('IMR_SQLIBLIND_HOME','SQLIBLIND_PYTHON','SQLIBLIND_BIN','SQLIBLIND_COMMAND','SQLIBLIND_NATIVE_COMMAND')){ if([Environment]::GetEnvironmentVariable($name,'User')){ exit 1 } }"
